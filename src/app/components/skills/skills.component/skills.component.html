<!-- ======================================================= -->
<!-- COMPÉTENCES - IDENTIQUE À LA VERSION DJANGO -->
<!-- ======================================================= -->
<section id="competences" class="py-5 py-lg-6">
    <div class="container">

        <h2 class="section-title text-center">
            <i class="fas fa-cogs me-2" style="color: var(--p);"></i>
            {{ sectionTitle }}
        </h2>

        <div class="row g-4">
            @for (skill of skillsList; track skill.name; let i = $index) {
                <div class="col-md-6" data-aos="fade-up" [attr.data-aos-delay]="(i + 1) * 50">
                    <div class="custom-card p-4">

                        <div class="skill-info">
                            <span class="skill-name">
                                <i [class]="skill.icon"></i>
                                {{ skill.name }}
                            </span>
                            <span class="skill-pct">{{ skill.level }}%</span>
                        </div>

                        <div class="skill-bar">
                            <!-- Ajout de #skillBar pour que le TS puisse cibler cet élément -->
                            <div #skillBar 
                                 class="skill-progress"
                                 [attr.data-width]="skill.level + '%'"
                                 style="width: 0%;">
                            </div>
                        </div>

                    </div>
                </div>
            }
        </div>

    </div>
</section>
