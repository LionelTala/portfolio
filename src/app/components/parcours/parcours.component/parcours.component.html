<!-- ======================================================= -->
<!-- PARCOURS - IDENTIQUE À LA VERSION DJANGO -->
<!-- ======================================================= -->
<section id="parcours" class="py-5 py-lg-6 section-alt">
    <div class="container">

        <h2 class="section-title text-center">
            <i class="fas fa-graduation-cap me-2" style="color: var(--p);"></i>
            {{ sectionTitle }}
        </h2>

        <div class="row g-4">
            @for (item of parcoursList; track item.title; let i = $index) {
                <div class="col-md-6" data-aos="fade-up" [attr.data-aos-delay]="(i + 1) * 100">
                    <div class="custom-card h-100 p-4 p-lg-5">

                        <!-- Badge période -->
                        <span class="timeline-year">
                            {{ item.period }}
                        </span>

                        <!-- Titre -->
                        <h4 class="fw-bold mt-2 mb-1" style="color: var(--heading);">
                            {{ item.title }}
                        </h4>

                        <!-- Institution -->
                        <p class="mb-3" style="color: var(--p); font-size: 0.9rem; font-weight: 500;">
                            <i class="fas fa-university me-2"></i>
                            {{ item.institution }}
                        </p>

                        <!-- Description (bilingue) -->
                        <p class="mb-0" style="font-size: 0.9rem; color: var(--muted);">
                            {{ getDescription(item) }}
                        </p>

                    </div>
                </div>
            }
        </div>

    </div>
</section>
