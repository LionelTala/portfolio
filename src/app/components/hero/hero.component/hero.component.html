<!-- ======================================================= -->
<!-- HERO - SECTION D'ACCUEIL (100% Bootstrap + CSS Custom) -->
<!-- ======================================================= -->
<section id="accueil" class="hero" aria-label="Présentation de Sikali Tala Francis Lionel">
    
    <div class="container">
        <div class="row align-items-center gy-5">

            <!-- Colonne Texte -->
            <div class="col-lg-7 order-2 order-lg-1 text-center text-lg-start" data-aos="fade-right" data-aos-delay="100">

                <!-- Badge -->
                <div class="badge-glow mb-4">
                    <i class="fas fa-code"></i>
                    <span>{{ heroTexts.badge }}</span>
                </div>

                <!-- H1 UNIQUE : Nom complet pour le SEO personnel -->
                <h1 class="display-3 fw-bold mb-3" style="color: var(--heading); letter-spacing: -0.03em;">
                    {{ data.profile.name }}<br>
                    <span class="grad-text">{{ data.profile.firstName }}</span>
                </h1>

                <!-- Typed.js Container -->
                <div class="typed-container mt-4 justify-content-center justify-content-lg-start">
                    <span #typedElement class="typed-text"></span>
                </div>

                <!-- Description -->
                <p class="lead mt-4 mx-auto mx-lg-0" style="max-width: 480px; color: var(--muted);">
                    {{ heroTexts.desc }}
                </p>

                <!-- Boutons d'action (CTA) -->
                <div class="d-flex flex-wrap gap-3 mt-4 justify-content-center justify-content-lg-start">
                    <a href="#contact" class="btn btn-gradient btn-lg">
                        <i class="fas fa-paper-plane me-2"></i>
                        {{ heroTexts.btnContact }}
                    </a>

                    <a href="assets/docs/cv-francis-tala.pdf" download="CV_SIKALI_TALA_Francis_Lionel.pdf" class="btn btn-outline-glow btn-lg">
                        <i class="fas fa-download me-2"></i>
                        {{ heroTexts.btnCv }}
                    </a>
                </div>

                <!-- Liens Sociaux -->
                <div class="social-links mt-5 justify-content-center justify-content-lg-start">
                    <a [href]="data.profile.github" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Profil GitHub de Francis Lionel">
                        <i class="fab fa-github"></i>
                    </a>
                    <a [href]="data.profile.linkedin" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Profil LinkedIn de Francis Lionel">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a [href]="'mailto:' + data.profile.email" class="social-icon" aria-label="Envoyer un email à Francis Lionel">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a [href]="`https://wa.me/+237659666110`" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Contacter Francis Lionel sur WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>

            </div>

            <!-- Colonne Photo -->
            <div class="col-lg-5 text-center order-1 order-lg-2 mb-5 mb-lg-0" data-aos="fade-left" data-aos-delay="200">
                <div style="position: relative; display: inline-block;">
                    
                    <!-- Anneau décoratif animé -->
                    <div style="
                        position: absolute; 
                        inset: -16px; 
                        border-radius: 50%;
                        background: conic-gradient(from 0deg, var(--p), var(--p2), var(--p3), var(--p));
                        opacity: 0.18;
                        animation: floatY 6s ease-in-out infinite;
                        filter: blur(2px);
                    "></div>
                    
                    <!-- Image de profil -->
                    <img src="assets/images/photo.jpg"
                         [alt]="data.profile.fullName + ' - Développeur Full Stack et Data Scientist au Cameroun'"
                         class="hero-photo"
                         loading="eager"
                         width="320"
                         height="320">
                </div>
            </div>

        </div>
    </div>
</section>
