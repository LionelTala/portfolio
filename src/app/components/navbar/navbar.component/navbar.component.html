<!-- ======================================================= -->
<!-- NAVBAR - IDENTIQUE AU STYLE DJANGO (Bootstrap 5) -->
<!-- ======================================================= -->
<nav class="glass-nav fixed-top py-3">
    <div class="container d-flex align-items-center justify-content-between">

        <!-- Logo FL -->
        <a class="navbar-brand" href="#accueil">FL</a>

        <!-- Mobile controls -->
        <div class="d-flex align-items-center gap-2 d-lg-none">

            <!-- Langue - bascule instantanée -->
            <button (click)="toggleLanguage()" class="lang-btn" type="button">
                <i class="fas fa-globe me-1"></i>
                <span>{{ lang().toUpperCase() }}</span>
            </button>

            <!-- Theme toggle mobile -->
            <button (click)="toggleTheme()" class="theme-toggle" aria-label="Changer le thème">
                <i class="fas" [class.fa-moon]="portfolioService.currentTheme() === 'light'" [class.fa-sun]="portfolioService.currentTheme() === 'dark'"></i>
            </button>

            <!-- Mobile toggler -->
            <button class="p-2 border-0" type="button" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Toggle navigation">
                <i class="fas fa-bars" style="color: var(--p);"></i>
            </button>
        </div>

        <!-- Desktop menu -->
        <div class="d-none d-lg-flex align-items-center gap-1">
            <ul class="d-flex align-items-center gap-1 list-unstyled mb-0">
                <li><a class="nav-link" [class.active]="isActive('accueil')" href="#accueil">{{ navItems.home }}</a></li>
                <li><a class="nav-link" [class.active]="isActive('parcours')" href="#parcours">{{ navItems.parcours }}</a></li>
                <li><a class="nav-link" [class.active]="isActive('competences')" href="#competences">{{ navItems.skills }}</a></li>
                <li><a class="nav-link" [class.active]="isActive('projets')" href="#projets">{{ navItems.projects }}</a></li>
                <li><a class="nav-link" [class.active]="isActive('contact')" href="#contact">{{ navItems.contact }}</a></li>
            </ul>

            <div class="d-flex align-items-center gap-2 ms-4">
                <button (click)="toggleLanguage()" class="lang-btn" type="button">
                    <i class="fas fa-globe me-1"></i>
                    <span>{{ lang().toUpperCase() }}</span>
                </button>
                <button (click)="toggleTheme()" class="theme-toggle" aria-label="Changer le thème">
                    <i class="fas" [class.fa-moon]="portfolioService.currentTheme() === 'light'" [class.fa-sun]="portfolioService.currentTheme() === 'dark'"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Mobile dropdown menu -->
    <div *ngIf="mobileMenuOpen" class="d-lg-none px-4 pt-4 pb-3 border-top mt-3 d-flex flex-column gap-3 mobile-menu">
        <a href="#accueil" (click)="closeMobileMenu()" class="nav-link-mobile" [class.active]="isActive('accueil')">{{ navItems.home }}</a>
        <a href="#parcours" (click)="closeMobileMenu()" class="nav-link-mobile" [class.active]="isActive('parcours')">{{ navItems.parcours }}</a>
        <a href="#competences" (click)="closeMobileMenu()" class="nav-link-mobile" [class.active]="isActive('competences')">{{ navItems.skills }}</a>
        <a href="#projets" (click)="closeMobileMenu()" class="nav-link-mobile" [class.active]="isActive('projets')">{{ navItems.projects }}</a>
        <a href="#contact" (click)="closeMobileMenu()" class="nav-link-mobile" [class.active]="isActive('contact')">{{ navItems.contact }}</a>
        <div class="d-flex gap-2 pt-2 border-top">
            <button (click)="toggleLanguage(); closeMobileMenu()" class="lang-switch-btn">
                {{ lang() === 'fr' ? '🇬 EN' : '🇫🇷 FR' }}
            </button>
        </div>
    </div>

</nav>
